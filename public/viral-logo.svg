<svg xmlns="http://www.w3.org/2000/svg" width="420" height="120" viewBox="0 0 420 120" fill="none">
  <title>Viral logo</title>
  <desc>The Viral four-block mark followed by the word Viral.</desc>
  <defs>
    <linearGradient id="large" x1="16" y1="14" x2="45" y2="43" gradientUnits="userSpaceOnUse"><stop stop-color="#218FF0"/><stop offset="1" stop-color="#269EF5"/></linearGradient>
    <linearGradient id="small" x1="58" y1="14" x2="82" y2="38" gradientUnits="userSpaceOnUse"><stop stop-color="#0871D4"/><stop offset="1" stop-color="#1676DC"/></linearGradient>
    <linearGradient id="light" x1="45" y1="43" x2="74" y2="72" gradientUnits="userSpaceOnUse"><stop stop-color="#5CC1F2"/><stop offset="1" stop-color="#55B8ED"/></linearGradient>
  </defs>
  <g transform="translate(10 10)">
    <rect x="16" y="14" width="29" height="29" rx="7" fill="url(#large)"/>
    <rect x="58" y="14" width="24" height="24" rx="6" fill="url(#small)"/>
    <rect x="16" y="62" width="24" height="24" rx="6" fill="url(#small)"/>
    <rect x="45" y="43" width="29" height="29" rx="7" fill="url(#light)"/>
  </g>
  <text x="112" y="72" fill="#EEF0EC" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="600" letter-spacing="8">VIRAL</text>
</svg>
