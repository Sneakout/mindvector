  <rect x="272" y="683" width="302" height="302" rx="78" fill="url(#deep)"/>
  <path d="M676 625H919C973 625 1017 669 1017 723V914C1017 968 973 1012 919 1012H762C708 1012 664 968 664 914V637C664 630 669 625 676 625Z" fill="url(#highlight)"/>
