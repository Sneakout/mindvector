<svg xmlns="http://www.w3.org/2000/svg" width="420" height="120" viewBox="0 0 420 120" fill="none">
  <title>Viral logo</title>
  <desc>Three overlapping orbit signals around a central node followed by the word Viral.</desc>
  <g transform="translate(10 10)" stroke="#C8FFB0" stroke-width="2">
    <ellipse cx="50" cy="50" rx="31" ry="18" transform="rotate(45 50 50)" opacity=".9"/>
    <ellipse cx="50" cy="50" rx="16" ry="36" transform="rotate(-45 50 50)" opacity=".7"/>
    <ellipse cx="50" cy="50" rx="36" ry="16" transform="rotate(10 50 50)" opacity=".55"/>
    <circle cx="50" cy="50" r="5" fill="#C8FFB0" stroke="none"/>
  </g>
  <text x="112" y="72" fill="#EEF0EC" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="600" letter-spacing="8">VIRAL</text>
</svg>
