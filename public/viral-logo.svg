<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Viral logo</title>
  <desc id="desc">Four rounded boxes in Viral's cyan and teal brand palette.</desc>
  <defs>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21DBEB"/>
      <stop offset="1" stop-color="#14C2D1"/>
    </linearGradient>
    <linearGradient id="supporting" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A7A8F"/>
      <stop offset="1" stop-color="#05576B"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A7A8F"/>
      <stop offset="1" stop-color="#05576B"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54E7EE"/>
      <stop offset="1" stop-color="#21DBEB"/>
    </linearGradient>
